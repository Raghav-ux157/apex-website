<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 400' width='100%' height='100%'>
  <defs>
    <radialGradient id='dialGrad-ph-chrono-1.svg' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#0d0e14' stop-opacity='1'/>
      <stop offset='100%' stop-color='#050507' stop-opacity='1'/>
    </radialGradient>
    <linearGradient id='caseGrad-ph-chrono-1.svg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#1f2029'/>
      <stop offset='50%' stop-color='#1a1b24'/>
      <stop offset='100%' stop-color='#1f2029'/>
    </linearGradient>
    <linearGradient id='strapGrad-ph-chrono-1.svg' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#18181b'/>
      <stop offset='100%' stop-color='#0a0a0d'/>
    </linearGradient>
    <filter id='shadow-ph-chrono-1.svg' x='-20%' y='-20%' width='140%' height='140%'>
      <feDropShadow dx='0' dy='12' stdDeviation='14' flood-color='#000000' flood-opacity='0.75'/>
    </filter>
  </defs>

  <!-- Straps (Top and Bottom) -->
  <rect x='152' y='10' width='96' height='100' rx='6' fill='url(#strapGrad-ph-chrono-1.svg)' />
  <rect x='152' y='290' width='96' height='100' rx='6' fill='url(#strapGrad-ph-chrono-1.svg)' />
  <line x1='158' y1='10' x2='158' y2='110' stroke='rgba(255,255,255,0.1)' stroke-dasharray='4,4'/>
  <line x1='242' y1='10' x2='242' y2='110' stroke='rgba(255,255,255,0.1)' stroke-dasharray='4,4'/>
  <line x1='158' y1='290' x2='158' y2='390' stroke='rgba(255,255,255,0.1)' stroke-dasharray='4,4'/>
  <line x1='242' y1='290' x2='242' y2='390' stroke='rgba(255,255,255,0.1)' stroke-dasharray='4,4'/>

  <!-- Outer Watch Case with Lugs -->
  <g filter='url(#shadow-ph-chrono-1.svg)'>
    <!-- Lugs -->
    <path d='M146,80 L160,140 L240,140 L254,80 Z' fill='#1f2029' opacity='0.9'/>
    <path d='M146,320 L160,260 L240,260 L254,320 Z' fill='#1f2029' opacity='0.9'/>

    <!-- Crown & Pushers -->
    <rect x='325' y='188' width='14' height='24' rx='3' fill='#f59e0b'/>
    
    <rect x='318' y='152' width='10' height='16' rx='2' fill='#1f2029'/>
    <rect x='318' y='232' width='10' height='16' rx='2' fill='#1f2029'/>
  

    <!-- Bezel -->
    <circle cx='200' cy='200' r='128' fill='url(#caseGrad-ph-chrono-1.svg)' stroke='#f59e0b' stroke-width='2'/>
    <circle cx='200' cy='200' r='118' fill='#08090d' stroke='rgba(255,255,255,0.1)' stroke-width='1'/>
    
    <!-- Dial -->
    <circle cx='200' cy='200' r='112' fill='url(#dialGrad-ph-chrono-1.svg)'/>
    
    <!-- Subtle Guilloche Circles -->
    <circle cx='200' cy='200' r='85' fill='none' stroke='rgba(255,255,255,0.04)' stroke-width='1'/>
    <circle cx='200' cy='200' r='60' fill='none' stroke='rgba(255,255,255,0.04)' stroke-width='1'/>

    <!-- Hour Markers -->
    <line x1='200' y1='94' x2='200' y2='108' stroke='#f59e0b' stroke-width='3.5' stroke-linecap='round' transform='rotate(0 200 200)'/>
    <line x1='200' y1='98' x2='200' y2='108' stroke='#f59e0b' stroke-width='2' stroke-linecap='round' transform='rotate(30 200 200)'/>
    <line x1='200' y1='98' x2='200' y2='108' stroke='#f59e0b' stroke-width='2' stroke-linecap='round' transform='rotate(60 200 200)'/>
    <line x1='200' y1='94' x2='200' y2='108' stroke='#f59e0b' stroke-width='3.5' stroke-linecap='round' transform='rotate(90 200 200)'/>
    <line x1='200' y1='98' x2='200' y2='108' stroke='#f59e0b' stroke-width='2' stroke-linecap='round' transform='rotate(120 200 200)'/>
    <line x1='200' y1='98' x2='200' y2='108' stroke='#f59e0b' stroke-width='2' stroke-linecap='round' transform='rotate(150 200 200)'/>
    <line x1='200' y1='94' x2='200' y2='108' stroke='#f59e0b' stroke-width='3.5' stroke-linecap='round' transform='rotate(180 200 200)'/>
    <line x1='200' y1='98' x2='200' y2='108' stroke='#f59e0b' stroke-width='2' stroke-linecap='round' transform='rotate(210 200 200)'/>
    <line x1='200' y1='98' x2='200' y2='108' stroke='#f59e0b' stroke-width='2' stroke-linecap='round' transform='rotate(240 200 200)'/>
    <line x1='200' y1='94' x2='200' y2='108' stroke='#f59e0b' stroke-width='3.5' stroke-linecap='round' transform='rotate(270 200 200)'/>
    <line x1='200' y1='98' x2='200' y2='108' stroke='#f59e0b' stroke-width='2' stroke-linecap='round' transform='rotate(300 200 200)'/>
    <line x1='200' y1='98' x2='200' y2='108' stroke='#f59e0b' stroke-width='2' stroke-linecap='round' transform='rotate(330 200 200)'/>

    <!-- Chrono sub-dials -->
    
    <circle cx='165' cy='200' r='20' fill='none' stroke='#f59e0b' stroke-width='1' opacity='0.7'/>
    <line x1='165' y1='200' x2='165' y2='186' stroke='#f59e0b' stroke-width='1.5'/>
    <circle cx='235' cy='200' r='20' fill='none' stroke='#f59e0b' stroke-width='1' opacity='0.7'/>
    <line x1='235' y1='200' x2='244' y2='200' stroke='#f59e0b' stroke-width='1.5'/>
    <circle cx='200' cy='238' r='18' fill='none' stroke='#f59e0b' stroke-width='1' opacity='0.7'/>
    <line x1='200' y1='238' x2='200' y2='226' stroke='#f59e0b' stroke-width='1.5'/>
  

    <!-- Brand Emblem & Text -->
    <polygon points='200,132 194,142 206,142' fill='#f59e0b' />
    <text x='200' y='154' fill='#ffffff' font-family='serif' font-size='11' font-weight='600' letter-spacing='3' text-anchor='middle'>APEX</text>
    <text x='200' y='163' fill='#f59e0b' font-family='sans-serif' font-size='6.5' letter-spacing='1.5' text-anchor='middle'>CHRONOMETRE</text>

    <!-- Date Window -->
    <rect x='254' y='193' width='22' height='14' rx='2' fill='#0e1017' stroke='#f59e0b' stroke-width='0.8'/>
    <text x='265' y='203.5' fill='#ffffff' font-family='sans-serif' font-size='8.5' font-weight='bold' text-anchor='middle'>18</text>

    <!-- Hands -->
    <line x1='200' y1='200' x2='160' y2='160' stroke='#f59e0b' stroke-width='4' stroke-linecap='round'/>
    <line x1='200' y1='200' x2='248' y2='130' stroke='#f59e0b' stroke-width='2.8' stroke-linecap='round'/>
    <line x1='200' y1='214' x2='200' y2='104' stroke='#e53e3e' stroke-width='1.2'/>
    <!-- Centre Cap -->
    <circle cx='200' cy='200' r='5' fill='#f59e0b' stroke='#000' stroke-width='1'/>
    <circle cx='200' cy='200' r='2' fill='#e53e3e'/>

    <!-- Lower Inscription -->
    <text x='200' y='268' fill='rgba(255,255,255,0.45)' font-family='sans-serif' font-size='6' letter-spacing='1' text-anchor='middle'>AUTOMATIC 42H</text>
    <text x='200' y='277' fill='rgba(255,255,255,0.3)' font-family='sans-serif' font-size='5.5' letter-spacing='1.5' text-anchor='middle'>SWISS ENGINE</text>
  </g>
</svg>